name: WA Stay Build and Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24.x]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          # The newest 24.x patch on every runner (the macOS image's cached 24.20 crashed Jest workers)
          check-latest: true
          cache: 'npm'

      # better-sqlite3 ships one prebuilt Node-API binary, loaded by Jest (Node) and the app
      # (Electron) alike: nothing to rebuild after npm ci.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test:coverage

      # SQLite's own timestamps are UTC with no zone: read them with the host in Perth (UTC+8).
      # TZ is set before Jest starts, since a running test cannot change its zone.
      - name: Run timestamp tests in Perth time
        run: npm run test:tz

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          # The newest 24.x patch on every runner (the macOS image's cached 24.20 crashed Jest workers)
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Public (pk.) token for Explore's map, bundled into the renderer. Without it the
          # build still succeeds and Explore is list-only.
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN || vars.MAPBOX_ACCESS_TOKEN }}

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron
            ~/AppData/Local/electron-builder
          key: windows-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            windows-electron-

      - name: Verify icon assets exist
        # Generated by `npm run icons` and committed; CI never regenerates them.
        run: |
          $assets = @(
            "resources/icons/icon.ico",
            "resources/icons/icon.png",
            "resources/icons/256x256.png",
            "resources/icons/installer-header.bmp",
            "resources/icons/installer-sidebar.bmp"
          )
          $missing = $assets | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            $missing | ForEach-Object { Write-Error "Missing $_ (run npm run icons and commit the result)" }
            exit 1
          }
        shell: pwsh

      - name: Build Windows installer
        run: |
          if ("${{ secrets.CSC_LINK }}" -ne "") {
            $env:CSC_LINK = "${{ secrets.CSC_LINK }}"
            $env:CSC_KEY_PASSWORD = "${{ secrets.CSC_KEY_PASSWORD }}"
          }
          npx electron-builder --win --publish never
        shell: pwsh

      # The app as packaged: WA Stay.exe's Electron fuses, the app.asar integrity record that
      # Electron checks on Windows, and one better-sqlite3 binary (scripts/check-windows-package.js)
      - name: Check the packaged Windows app
        run: node scripts/check-windows-package.js release/win-unpacked

      # The installer's .blockmap lets electron-updater download only the blocks that changed
      # (docs/release-process.md): every release must carry it.
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 14

  release:
    name: Create Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
